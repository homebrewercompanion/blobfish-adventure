<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08313d">
<title>Blobfish Adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129429;</text></svg>">
<style>
  :root{
    --pink:#f3a99c; --pink-d:#c9756a; --deep:#08313d; --deep2:#0d475a;
    --gold:#ffc93c; --gold-d:#d99a00; --cream:#fff4e6; --green:#4ecb7a;
    --ui: "Baloo 2", "Trebuchet MS", "Segoe UI Rounded", system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:var(--ui);
    color:var(--cream); user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none;}
  canvas{display:block;position:fixed;inset:0;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .panel{background:rgba(8,49,61,.86); border:3px solid var(--pink); border-radius:18px;
    box-shadow:0 6px 0 rgba(0,0,0,.25), inset 0 0 24px rgba(0,0,0,.3);}
  .btn{pointer-events:auto; cursor:pointer; font-family:var(--ui); font-weight:800; color:var(--deep);
    background:linear-gradient(#ffe08a,var(--gold)); border:3px solid #7a5200; border-radius:16px;
    box-shadow:0 5px 0 var(--gold-d); padding:10px 18px; font-size:18px; transition:transform .06s, box-shadow .06s;}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--gold-d);}
  .btn.ghost{background:linear-gradient(#8fd7ea,#4aa8c4); border-color:#14536b; box-shadow:0 5px 0 #14536b; color:#052731;}
  .btn:disabled{filter:grayscale(.7) brightness(.8); cursor:default;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;opacity:0;transition:opacity .4s;}
  #hud.on{opacity:1;}
  #topleft{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:10px;}
  #rankBadge{width:56px;height:56px;border-radius:50%;background:var(--pink);
    border:4px solid var(--cream); display:grid;place-items:center;font-weight:900;font-size:22px;color:#5b241d;
    box-shadow:0 4px 0 rgba(0,0,0,.3);}
  #xpwrap{width:150px;}
  #rankName{font-size:15px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.5);margin-bottom:3px;}
  #xpbar{height:12px;background:rgba(0,0,0,.45);border:2px solid var(--cream);border-radius:8px;overflow:hidden;}
  #xpfill{height:100%;width:0%;background:linear-gradient(90deg,#7ef7b0,var(--green));transition:width .3s;}

  #topright{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  #coins{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:26px;
    background:rgba(8,49,61,.8);border:3px solid var(--gold);font-weight:900;font-size:22px;color:var(--gold);
    box-shadow:0 4px 0 rgba(0,0,0,.3);}
  #coins .orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#9be8ff 40%,#37a7cf);
    box-shadow:0 0 10px #7fe0ff;}
  #coins.pulse{animation:pop .35s;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

  #tracker{max-width:270px;padding:10px 14px;border-radius:16px;background:rgba(8,49,61,.8);
    border:none;border-left:6px solid var(--gold); font-size:15px; line-height:1.35; display:none;}
  #tracker h4{margin:0 0 4px;font-size:16px;color:var(--gold);}
  #tracker .tick{color:var(--green);}
  #pearlRow{display:flex;gap:6px;margin-top:8px;}
  .pearl{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);}
  .pearl.got{background:radial-gradient(circle at 32% 30%,#fff,#ffe9a8 45%,#ffb43c);box-shadow:0 0 12px #ffcf6a;border-color:#fff;}

  #combo{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;
    color:var(--gold);text-shadow:0 3px 0 #7a5200,0 0 22px #ffbe3c;opacity:0;transition:opacity .2s;text-align:center;}
  #combo.on{opacity:1;}

  #toasts{position:absolute;bottom:24%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:8px;width:min(90vw,460px);}
  .toast{padding:10px 20px;border-radius:30px;background:rgba(8,49,61,.92);border:3px solid var(--gold);
    font-weight:800;font-size:17px;text-align:center;animation:toastIn .35s;box-shadow:0 5px 0 rgba(0,0,0,.3);}
  .toast.good{border-color:var(--green);color:#c8ffe0;}
  @keyframes toastIn{from{transform:translateY(24px) scale(.8);opacity:0}to{transform:none;opacity:1}}

  #zoneCard{position:absolute;top:26%;left:0;right:0;text-align:center;opacity:0;transition:opacity .6s;}
  #zoneCard.on{opacity:1;}
  #zoneCard b{font-size:clamp(28px,7vw,52px);letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 30px #7fe0ff;}
  #zoneCard span{display:block;font-size:16px;opacity:.85;letter-spacing:4px;text-transform:uppercase;}

  #prompt{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);display:none;align-items:center;gap:10px;
    padding:8px 18px;border-radius:30px;background:rgba(8,49,61,.9);border:3px solid var(--cream);font-weight:800;}
  #prompt .key{background:var(--cream);color:var(--deep);border-radius:8px;padding:1px 9px;font-weight:900;}

  #dialog{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(94vw,720px);
    padding:16px 20px 18px;display:none;pointer-events:auto;}
  #dialog .who{position:absolute;top:-16px;left:20px;background:var(--pink);color:#4a1a14;font-weight:900;
    padding:3px 16px;border-radius:20px;border:3px solid var(--cream);font-size:16px;}
  #dialog .txt{font-size:clamp(16px,2.4vw,20px);line-height:1.45;min-height:3.2em;}
  #dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;}

  #modal{position:absolute;inset:0;background:rgba(3,20,26,.72);display:none;place-items:center;pointer-events:auto;padding:12px;}
  #modalBox{width:min(96vw,760px);max-height:88vh;overflow:auto;padding:18px 20px;}
  #modalBox h2{margin:0 0 4px;font-size:26px;color:var(--gold);}
  #modalBox .sub{opacity:.8;margin-bottom:14px;font-size:15px;}
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
  .item{padding:12px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);text-align:center;}
  .item .ico{font-size:34px;line-height:1.1;}
  .item .nm{font-weight:800;margin:4px 0 2px;}
  .item .ds{font-size:13px;opacity:.8;min-height:2.4em;}
  .item .price{color:var(--gold);font-weight:900;margin:6px 0;}
  .item.owned{border-color:var(--green);}
  .qcard{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border-left:5px solid var(--gold);margin-bottom:10px;}
  .qcard.done{border-left-color:var(--green);opacity:.6;}
  .qcard h4{margin:0 0 4px;font-size:18px;}
  .qcard .step{font-size:14px;opacity:.9;}
  .closeRow{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;}

  #touch{position:absolute;inset:0;display:none;}
  #stickZone{position:absolute;left:0;bottom:0;width:45%;height:70%;pointer-events:auto;}
  #stick{position:fixed;width:130px;height:130px;border-radius:50%;border:4px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);display:none;transform:translate(-50%,-50%);}
  #knob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%,#fff,var(--pink));border:3px solid #fff;}
  #btns{position:absolute;right:16px;bottom:20px;display:flex;gap:12px;align-items:flex-end;}
  .rbtn{pointer-events:auto;width:80px;height:80px;border-radius:50%;border:4px solid rgba(255,255,255,.7);
    display:grid;place-items:center;font-weight:900;font-size:14px;color:#052731;
    background:radial-gradient(circle at 35% 28%,#fff,#9be8ff 55%,#4aa8c4);box-shadow:0 6px 0 rgba(0,0,0,.35);}
  .rbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
  .rbtn.big{width:96px;height:96px;background:radial-gradient(circle at 35% 28%,#fff,#ffe08a 55%,var(--gold));}
  .rbtn.act{background:radial-gradient(circle at 35% 28%,#fff,#b4ffcf 55%,var(--green));display:none;}
  #topbtns{display:flex;gap:8px;}
  #topbtns .btn{padding:8px 12px;font-size:15px;}

  #start{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;
    background:radial-gradient(ellipse at 50% 40%,#0d5064,#04222c 70%);text-align:center;padding:20px;}
  #start .inner{max-width:560px;}
  #start h1{font-size:clamp(38px,10vw,74px);margin:0;color:var(--pink);
    text-shadow:0 6px 0 #7a3d34,0 0 40px #ff9c88;letter-spacing:1px;}
  #start h1 span{display:block;font-size:.42em;color:var(--gold);text-shadow:0 4px 0 #7a5200;letter-spacing:6px;}
  #start p{font-size:17px;opacity:.9;line-height:1.5;}
  #nameIn{pointer-events:auto;font-family:var(--ui);font-size:20px;font-weight:800;text-align:center;
    padding:10px 16px;border-radius:14px;border:3px solid var(--pink);background:rgba(255,255,255,.9);color:var(--deep);width:230px;}
  #startRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  #loading{position:absolute;bottom:24px;left:0;right:0;text-align:center;opacity:.7;font-size:14px;}
  .hidden{display:none !important;}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;}
</style>
</head>
<body>
<div id="ui">
  <div id="hud">
    <div id="topleft">
      <div id="rankBadge">1</div>
      <div id="xpwrap"><div id="rankName">Tiny Blob</div><div id="xpbar"><div id="xpfill"></div></div></div>
    </div>
    <div id="topright">
      <div id="coins"><div class="orb"></div><span id="coinNum">0</span></div>
      <div id="topbtns">
        <button class="btn ghost" id="btnJournal">Quests</button>
        <button class="btn ghost" id="btnMenu">Menu</button>
      </div>
      <div id="tracker">
        <h4 id="trackTitle">Quest</h4>
        <div id="trackSteps"></div>
        <div id="pearlRow"></div>
      </div>
    </div>
    <div id="combo"></div>
    <div id="zoneCard"><b></b><span></span></div>
    <div id="toasts"></div>
    <div id="prompt"><span class="key">E</span><span id="promptTxt">Talk</span></div>
  </div>

  <div id="dialog" class="panel">
    <div class="who">Someone</div>
    <div class="txt"></div>
    <div class="row"></div>
  </div>

  <div id="modal"><div id="modalBox" class="panel"></div></div>

  <div id="touch">
    <div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
    <div id="btns">
      <div class="rbtn act" id="tAct">TALK</div>
      <div class="rbtn" id="tDash">DASH</div>
      <div class="rbtn big" id="tJump">JUMP</div>
    </div>
  </div>

  <div id="start">
    <div class="inner">
      <h1>Blobfish<span>Adventure</span></h1>
      <p>The Great Bubble Vent has gone out and the Deep is turning cold and squishy.<br>
         Find the five <b style="color:var(--gold)">Glow Pearls</b> and light it up again!</p>
      <input id="nameIn" maxlength="12" placeholder="Your blob name" autocomplete="off">
      <div id="startRow">
        <button class="btn" id="btnPlay">Start Adventure</button>
        <button class="btn ghost hidden" id="btnContinue">Continue</button>
      </div>
      <div id="loading">Blowing up bubbles...</div>
    </div>
  </div>
  <div id="fade"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js" } }
</script>
<script type="module" src="./src/game.js"></script>
</body>
</html>
